<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ring of Future</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-screen">

    <!-- 1. TOP APP BAR (EXACT NATIVE APP WALLET PILL) -->
    <div class="top-bar">
      <button class="btn-icon-back" onclick="handleBack()">←</button>
      <div class="game-title">Ring of Future</div>
      
      <!-- Exact Native App Wallet Chip -->
      <div class="wallet-chip-container" onclick="handleDeposit()">
        <div class="wallet-pill-bg">
          <span class="wallet-amount-text" id="walletDisplay">0.00</span>
        </div>
        <img src="ic_gold_chip.webp" class="wallet-coin-img" alt="coin" />
      </div>
    </div>

    <!-- WIN TOAST -->
    <div class="win-toast" id="winToast" onclick="hideWin()">
      <div>
        <div class="win-toast-title">ROUND WON!</div>
        <div style="font-size: 11px; opacity: 0.85;">Added to your wallet balance</div>
      </div>
      <div class="win-toast-amount" id="winToastAmount">0</div>
    </div>

    <!-- 2. MINIMALIST CLEAN RING STAGE -->
    <div class="wheel-stage">
      <div class="wheel-container">
        <div class="wheel-bezel"></div>
        <canvas id="wheelCanvas" width="286" height="286"></canvas>
        
        <!-- Clean Pointer Needle -->
        <div class="pointer-needle">
          <svg viewBox="0 0 18 22" fill="none">
            <path d="M9 22L0 4C0 1.79086 1.79086 0 4 0H14C16.2091 0 18 1.79086 18 4L9 22Z" fill="#FFFFFF"/>
            <path d="M9 17L3 4H15L9 17Z" fill="#FFB800"/>
          </svg>
        </div>

        <!-- Center Hub -->
        <div class="center-hub">
          <div class="hub-seconds" id="hubSeconds">15s</div>
          <div class="hub-status" id="hubStatus">PLACE BETS</div>
        </div>
      </div>

      <!-- History Bar -->
      <div class="history-bar">
        <span class="history-label">Recent:</span>
        <div id="historyRow" style="display: flex; gap: 5px;"></div>
      </div>
    </div>

    <!-- 3. APP-STYLE BETTING GRID -->
    <div>
      <div class="bet-grid">
        <div class="card-tile tile-2x" id="tile2x" onclick="handleBet('2x')">
          <div class="tile-top">
            <span class="tile-mult">2x</span>
            <span class="tile-desc">Low Risk</span>
          </div>
          <div class="tile-bet-pill" id="badge2x">
            <img src="ic_gold_chip.webp" class="tile-bet-coin" />
            <span id="badgeText2x">0</span>
          </div>
        </div>

        <div class="card-tile tile-3x" id="tile3x" onclick="handleBet('3x')">
          <div class="tile-top">
            <span class="tile-mult">3x</span>
            <span class="tile-desc">Medium</span>
          </div>
          <div class="tile-bet-pill" id="badge3x">
            <img src="ic_gold_chip.webp" class="tile-bet-coin" />
            <span id="badgeText3x">0</span>
          </div>
        </div>

        <div class="card-tile tile-5x" id="tile5x" onclick="handleBet('5x')">
          <div class="tile-top">
            <span class="tile-mult">5x</span>
            <span class="tile-desc">High Win</span>
          </div>
          <div class="tile-bet-pill" id="badge5x">
            <img src="ic_gold_chip.webp" class="tile-bet-coin" />
            <span id="badgeText5x">0</span>
          </div>
        </div>

        <div class="card-tile tile-30x" id="tile30x" onclick="handleBet('30x')">
          <div class="tile-top">
            <span class="tile-mult">30x</span>
            <span class="tile-desc" style="color: #34D399;">Mega Win</span>
          </div>
          <div class="tile-bet-pill" id="badge30x">
            <img src="ic_gold_chip.webp" class="tile-bet-coin" />
            <span id="badgeText30x">0</span>
          </div>
        </div>
      </div>

      <!-- 4. CHIP SELECTOR (NUMBERS ONLY) -->
      <div class="chip-selector-dock">
        <button class="chip-btn-item active" onclick="selectChip(10, this)">10</button>
        <button class="chip-btn-item" onclick="selectChip(500, this)">500</button>
        <button class="chip-btn-item" onclick="selectChip(2000, this)">2K</button>
        <button class="chip-btn-item" onclick="selectChip(5000, this)">5K</button>
        <button class="chip-btn-item" onclick="selectChip(20000, this)">20K</button>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
