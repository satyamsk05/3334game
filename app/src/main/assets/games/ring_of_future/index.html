<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ring of Future</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Rubik';
      src: url('rubik_bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Rubik';
      src: url('rubik_bold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
    }
    @font-face {
      font-family: 'Rubik';
      src: url('rubik_regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Rubik';
      src: url('rubik_regular.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    :root {
      --bg-app: #0A0C11;
      --card-bg: #1B2230;
      --card-border: #2F394C;
      --card-surface: #202A3B;
      --c-2x: #64748B;
      --c-3x: #8B5CF6;
      --c-5x: #F97316;
      --c-30x: #10B981;
      --gold: #FFB800;
      --purple-primary: #6C47FF;
      --text-primary: #FFFFFF;
      --text-muted: #8E9BAE;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Rubik', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-app);
      color: var(--text-primary);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-screen {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 920px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 16px 16px;
      position: relative;
    }

    /* 1. TOP APP BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 48px;
      z-index: 10;
    }

    .btn-icon-back {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
      transition: background 0.15s, transform 0.15s;
    }
    .btn-icon-back:active { transform: scale(0.92); }

    .game-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text-primary);
    }

    /* EXACT NATIVE APP WALLET CHIP (MATCHING WalletChip.kt & SCREENSHOT 2) */
    .wallet-chip-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      height: 38px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.12s ease;
    }
    .wallet-chip-container:active {
      transform: scale(0.96);
    }
    .wallet-pill-bg {
      height: 36px;
      margin-left: 12px;
      padding-left: 30px;
      padding-right: 14px;
      background: #1B2230;
      border: 1px solid #2F394C;
      border-radius: 9999px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .wallet-amount-text {
      font-family: 'Rubik', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.3px;
      line-height: 1;
      white-space: nowrap;
    }
    .wallet-coin-img {
      position: absolute;
      left: 0;
      top: 0;
      width: 38px;
      height: 38px;
      object-fit: contain;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.45));
      pointer-events: none;
    }

    /* 2. RING / WHEEL STAGE */
    .wheel-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 2px 0;
    }

    .wheel-container {
      position: relative;
      width: 296px;
      height: 296px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer Metallic Bezel Ring */
    .wheel-bezel {
      position: absolute;
      width: 294px;
      height: 294px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 2;
    }

    canvas#wheelCanvas {
      display: block;
      width: 286px;
      height: 286px;
      border-radius: 50%;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      z-index: 1;
    }

    /* Top Indicator Pointer Needle */
    .pointer-needle {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 22px;
      z-index: 8;
      pointer-events: none;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.8));
    }
    .pointer-needle svg {
      width: 100%;
      height: 100%;
    }

    /* Center Hub */
    .center-hub {
      position: absolute;
      width: 122px;
      height: 122px;
      border-radius: 50%;
      background: radial-gradient(circle, #18202E 0%, #101520 85%);
      border: 2px solid var(--card-border);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.8), inset 0 0 12px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
    }
    .hub-seconds {
      font-size: 26px;
      font-weight: 800;
      color: #34D399;
      line-height: 1;
    }
    .hub-status {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* History Bar */
    .history-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      margin-top: 10px;
    }
    .history-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      margin-right: 4px;
    }
    .h-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 8px;
      color: white;
    }
    .hp-2x { background: #475569; }
    .hp-3x { background: #7C3AED; }
    .hp-5x { background: #EA580C; }
    .hp-30x { background: #059669; }

    /* 3. APP-STYLE BETTING CARDS */
    .bet-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-tile {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      height: 84px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      transition: border-color 0.15s, transform 0.12s, background 0.15s;
    }
    .card-tile:active {
      transform: scale(0.96);
    }

    .tile-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .tile-mult {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
    }
    .tile-2x .tile-mult { color: #CBD5E1; }
    .tile-3x .tile-mult { color: #A78BFA; }
    .tile-5x .tile-mult { color: #FB923C; }
    .tile-30x .tile-mult { color: #34D399; }

    .tile-desc {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .tile-bet-pill {
      align-self: flex-start;
      background: #141923;
      border: 1px solid var(--card-border);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      display: none;
      align-items: center;
      gap: 4px;
    }
    .tile-bet-coin {
      width: 12px;
      height: 12px;
      object-fit: contain;
    }

    .tile-2x.has-bet { border-color: #64748B; background: rgba(30, 41, 59, 0.8); }
    .tile-3x.has-bet { border-color: #8B5CF6; background: rgba(59, 7, 100, 0.4); }
    .tile-5x.has-bet { border-color: #F97316; background: rgba(67, 20, 7, 0.4); }
    .tile-30x.has-bet { border-color: #10B981; background: rgba(6, 78, 59, 0.4); }

    /* 4. CHIP SELECTOR (EXACT MATCH TO SCREENSHOT 2) */
    .chip-selector-dock {
      background: #111722;
      border: 1px solid #202A3C;
      border-radius: 16px;
      padding: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chip-btn-item {
      flex: 1;
      height: 40px;
      border-radius: 12px;
      background: transparent;
      border: 1.5px solid transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease-out;
    }
    .chip-btn-item:active { transform: scale(0.94); }
    .chip-btn-item.active {
      background: var(--purple-primary);
      color: #FFFFFF;
      border: 1.5px solid #3B82F6;
      box-shadow: 0 0 12px rgba(108, 71, 255, 0.5);
      font-weight: 800;
    }

    /* 5. WIN NOTIFICATION */
    .win-toast {
      position: absolute;
      top: 58px;
      left: 16px;
      right: 16px;
      background: #10B981;
      color: #FFFFFF;
      padding: 12px 18px;
      border-radius: 14px;
      display: none;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
      z-index: 50;
      animation: toastIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .win-toast-title { font-size: 13px; font-weight: 800; }
    .win-toast-amount { font-size: 17px; font-weight: 900; }
  </style>
</head>
<body>

  <div class="game-screen">

    <!-- 1. TOP APP BAR (EXACT NATIVE APP WALLET PILL) -->
    <div class="top-bar">
      <button class="btn-icon-back" onclick="handleBack()">←</button>
      <div class="game-title">Ring of Future</div>
      
      <!-- Exact Native App Wallet Chip (Matching Screenshot 2) -->
      <div class="wallet-chip-container" onclick="handleDeposit()">
        <div class="wallet-pill-bg">
          <span class="wallet-amount-text" id="walletDisplay">0.00</span>
        </div>
        <img src="ic_gold_chip.webp" class="wallet-coin-img" alt="coin" />
      </div>
    </div>

    <!-- WIN TOAST -->
    <div class="win-toast" id="winToast" onclick="hideWin()">
      <div>
        <div class="win-toast-title">ROUND WON!</div>
        <div style="font-size: 11px; opacity: 0.85;">Added to your wallet balance</div>
      </div>
      <div class="win-toast-amount" id="winToastAmount">0</div>
    </div>

    <!-- 2. MINIMALIST CLEAN RING STAGE -->
    <div class="wheel-stage">
      <div class="wheel-container">
        <div class="wheel-bezel"></div>
        <canvas id="wheelCanvas" width="286" height="286"></canvas>
        
        <!-- Clean Pointer Needle -->
        <div class="pointer-needle">
          <svg viewBox="0 0 18 22" fill="none">
            <path d="M9 22L0 4C0 1.79086 1.79086 0 4 0H14C16.2091 0 18 1.79086 18 4L9 22Z" fill="#FFFFFF"/>
            <path d="M9 17L3 4H15L9 17Z" fill="#FFB800"/>
          </svg>
        </div>

        <!-- Center Hub -->
        <div class="center-hub">
          <div class="hub-seconds" id="hubSeconds">15s</div>
          <div class="hub-status" id="hubStatus">PLACE BETS</div>
        </div>
      </div>

      <!-- History Bar -->
      <div class="history-bar">
        <span class="history-label">Recent:</span>
        <div id="historyRow" style="display: flex; gap: 5px;"></div>
      </div>
    </div>

    <!-- 3. APP-STYLE BETTING GRID -->
    <div>
      <div class="bet-grid">
        <div class="card-tile tile-2x" id="tile2x" onclick="handleBet('2x')">
          <div class="tile-top">
            <span class="tile-mult">2x</span>
            <span class="tile-desc">Low Risk</span>
          </div>
          <div class="tile-bet-pill" id="badge2x">
            <img src="ic_gold_chip.webp" class="tile-bet-coin" />
            <span id="badgeText2x">0</span>
          </div>
        </div>

        <div class="card-tile tile-3x" id="tile3x" onclick="handleBet('3x')">
          <div class="tile-top">
            <span class="tile-mult">3x</span>
            <span class="tile-desc">Medium</span>
          </div>
          <div class="tile-bet-pill" id="badge3x">
            <img src="ic_gold_chip.webp" class="tile-bet-coin" />
            <span id="badgeText3x">0</span>
          </div>
        </div>

        <div class="card-tile tile-5x" id="tile5x" onclick="handleBet('5x')">
          <div class="tile-top">
            <span class="tile-mult">5x</span>
            <span class="tile-desc">High Win</span>
          </div>
          <div class="tile-bet-pill" id="badge5x">
            <img src="ic_gold_chip.webp" class="tile-bet-coin" />
            <span id="badgeText5x">0</span>
          </div>
        </div>

        <div class="card-tile tile-30x" id="tile30x" onclick="handleBet('30x')">
          <div class="tile-top">
            <span class="tile-mult">30x</span>
            <span class="tile-desc" style="color: #34D399;">Mega Win</span>
          </div>
          <div class="tile-bet-pill" id="badge30x">
            <img src="ic_gold_chip.webp" class="tile-bet-coin" />
            <span id="badgeText30x">0</span>
          </div>
        </div>
      </div>

      <!-- 4. CHIP SELECTOR (EXACT MATCH TO SCREENSHOT 2, NUMBERS ONLY) -->
      <div class="chip-selector-dock">
        <button class="chip-btn-item active" onclick="selectChip(10, this)">10</button>
        <button class="chip-btn-item" onclick="selectChip(500, this)">500</button>
        <button class="chip-btn-item" onclick="selectChip(2000, this)">2K</button>
        <button class="chip-btn-item" onclick="selectChip(5000, this)">5K</button>
        <button class="chip-btn-item" onclick="selectChip(20000, this)">20K</button>
      </div>
    </div>

  </div>

  <script>
    // Android Bridge Dynamic Resolution
    const serverBaseUrl = (window.AndroidBridge && window.AndroidBridge.getServerUrl)
      ? window.AndroidBridge.getServerUrl()
      : 'http://3.7.73.109:4001';

    let userId = (window.AndroidBridge && window.AndroidBridge.getUserId)
      ? window.AndroidBridge.getUserId()
      : '';
    let authToken = (window.AndroidBridge && window.AndroidBridge.getAuthToken)
      ? window.AndroidBridge.getAuthToken()
      : '';

    let selectedChipRupees = 10;
    let currentPhase = 'BETTING';
    let currentRotationDeg = 0;
    let isSpinningAnimation = false;
    let lastSpunRoundId = null;

    // 32 Segment Multipliers & Colors
    const SEGMENTS = [
      { mult: '30x', color: '#10B981' },
      { mult: '2x',  color: '#475569' },
      { mult: '3x',  color: '#8B5CF6' },
      { mult: '2x',  color: '#475569' },
      { mult: '5x',  color: '#EA580C' },
      { mult: '2x',  color: '#475569' },
      { mult: '3x',  color: '#8B5CF6' },
      { mult: '2x',  color: '#475569' },
      { mult: '5x',  color: '#EA580C' },
      { mult: '2x',  color: '#475569' },
      { mult: '3x',  color: '#8B5CF6' },
      { mult: '2x',  color: '#475569' },
      { mult: '3x',  color: '#8B5CF6' },
      { mult: '2x',  color: '#475569' },
      { mult: '5x',  color: '#EA580C' },
      { mult: '2x',  color: '#475569' },
      { mult: '3x',  color: '#8B5CF6' },
      { mult: '2x',  color: '#475569' },
      { mult: '3x',  color: '#8B5CF6' },
      { mult: '2x',  color: '#475569' },
      { mult: '5x',  color: '#EA580C' },
      { mult: '2x',  color: '#475569' },
      { mult: '3x',  color: '#8B5CF6' },
      { mult: '2x',  color: '#475569' },
      { mult: '5x',  color: '#EA580C' },
      { mult: '2x',  color: '#475569' },
      { mult: '3x',  color: '#8B5CF6' },
      { mult: '2x',  color: '#475569' },
      { mult: '3x',  color: '#8B5CF6' },
      { mult: '2x',  color: '#475569' },
      { mult: '5x',  color: '#EA580C' },
      { mult: '3x',  color: '#8B5CF6' }
    ];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const outerRadius = 140;
    const innerRadius = 72;

    // High-Resolution Crisp Donut Wheel Rendering with Multiplier Labels
    function renderDetailedWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const totalSegments = 32;
      const anglePerSegment = (2 * Math.PI) / totalSegments;

      ctx.save();
      ctx.translate(centerX, centerY);

      for (let i = 0; i < totalSegments; i++) {
        // Segment 0 (30x Green) is centered at 12 o'clock (-Math.PI / 2) under needle pointer
        const midAngle = -Math.PI / 2 + i * anglePerSegment;
        const startAngle = midAngle - anglePerSegment / 2;
        const endAngle = midAngle + anglePerSegment / 2;
        const seg = SEGMENTS[i];

        // Draw Arc Segment
        ctx.beginPath();
        ctx.arc(0, 0, outerRadius, startAngle, endAngle);
        ctx.arc(0, 0, innerRadius, endAngle, startAngle, true);
        ctx.closePath();

        ctx.fillStyle = seg.color;
        ctx.fill();

        // Divider Line
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = '#0A0C11';
        ctx.stroke();

        // Draw Multiplier Label (2x, 3x, 5x, 30x)
        ctx.save();
        ctx.rotate(midAngle);
        ctx.translate((outerRadius + innerRadius) / 2, 0);
        ctx.rotate(Math.PI / 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 9px Rubik, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(seg.mult, 0, 0);
        ctx.restore();

        // Outer LED divider dot at segment boundary
        const dotX = Math.cos(startAngle) * (outerRadius - 3);
        const dotY = Math.sin(startAngle) * (outerRadius - 3);
        ctx.beginPath();
        ctx.arc(dotX, dotY, 1.4, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.fill();
      }

      ctx.restore();
    }

    renderDetailedWheel();

    function selectChip(amount, btn) {
      selectedChipRupees = amount;
      document.querySelectorAll('.chip-btn-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function handleBack() {
      if (window.AndroidBridge && window.AndroidBridge.closeGame) {
        window.AndroidBridge.closeGame();
      } else {
        window.history.back();
      }
    }

    function handleDeposit() {
      if (window.AndroidBridge && window.AndroidBridge.openDeposit) {
        window.AndroidBridge.openDeposit();
      } else {
        window.location.href = serverBaseUrl + '/pay?amount=500';
      }
    }

    async function handleBet(multiplierType) {
      if (currentPhase !== 'BETTING') {
        alert('Bets are closed for this round');
        return;
      }

      try {
        const headers = { 'Content-Type': 'application/json' };
        if (authToken) headers['Authorization'] = 'Bearer ' + authToken;

        const res = await fetch(serverBaseUrl + '/api/v1/ring-of-future/bet', {
          method: 'POST',
          headers,
          body: JSON.stringify({ userId, multiplierType, amountRupees: selectedChipRupees, token: authToken })
        });
        const data = await res.json();
        if (data.success) {
          updateUI(data.data);
        } else {
          alert(data.message || 'Unable to place bet');
        }
      } catch (_) {
        alert('Network connection issue');
      }
    }

    function updateUI(data) {
      if (!data) return;
      const state = data.gameState;
      const wallet = data.wallet;

      currentPhase = state.phase;
      // ONLY NUMBER: NO CURRENCY SYMBOL (e.g. "8.20")
      document.getElementById('walletDisplay').innerText = (wallet.totalPaise / 100).toFixed(2);
      document.getElementById('hubSeconds').innerText = state.secondsRemaining + 's';

      if (state.phase === 'BETTING') {
        document.getElementById('hubStatus').innerText = 'PLACE BETS';
        document.getElementById('hubSeconds').style.color = '#34D399';
        // Always show 30x Green centered under needle during loading / bet placing
        const targetDeg = Math.ceil(currentRotationDeg / 360) * 360;
        if (currentRotationDeg !== targetDeg && !isSpinningAnimation) {
          canvas.style.transition = 'transform 1.2s cubic-bezier(0.25, 1, 0.5, 1)';
          canvas.style.transform = `rotate(${targetDeg}deg) translate3d(0, 0, 0)`;
          currentRotationDeg = targetDeg;
        }
      } else if (state.phase === 'LOCKED') {
        document.getElementById('hubStatus').innerText = 'LOCKED';
        document.getElementById('hubSeconds').style.color = '#F59E0B';
      } else if (state.phase === 'SPINNING') {
        document.getElementById('hubStatus').innerText = 'SPINNING';
        document.getElementById('hubSeconds').style.color = '#A78BFA';
        if (lastSpunRoundId !== state.roundId) {
          lastSpunRoundId = state.roundId;
          triggerSpin(state.winningSegmentIndex);
        }
      } else if (state.phase === 'RESULT_SHOW') {
        document.getElementById('hubStatus').innerText = 'WIN: ' + state.winningType;
        document.getElementById('hubSeconds').style.color = '#34D399';
      }

      // Update Badges & Active Tile Outlines (NUMBERS ONLY)
      updateTileBadge('badge2x', 'badgeText2x', 'tile2x', state.userBets.grey2x);
      updateTileBadge('badge3x', 'badgeText3x', 'tile3x', state.userBets.purple3x);
      updateTileBadge('badge5x', 'badgeText5x', 'tile5x', state.userBets.orange5x);
      updateTileBadge('badge30x', 'badgeText30x', 'tile30x', state.userBets.green30x);

      // Render History
      renderHistory(state.recentResults || []);
    }

    function updateTileBadge(badgeId, textId, tileId, paise) {
      const badge = document.getElementById(badgeId);
      const text = document.getElementById(textId);
      const tile = document.getElementById(tileId);
      if (paise > 0) {
        text.innerText = (paise / 100).toFixed(0);
        badge.style.display = 'flex';
        tile.classList.add('has-bet');
      } else {
        badge.style.display = 'none';
        tile.classList.remove('has-bet');
      }
    }

    function renderHistory(results) {
      const row = document.getElementById('historyRow');
      row.innerHTML = results.slice(0, 6).map(type => {
        let cls = 'hp-2x';
        if (type === '3x') cls = 'hp-3x';
        if (type === '5x') cls = 'hp-5x';
        if (type === '30x') cls = 'hp-30x';
        return `<span class="h-pill ${cls}">${type}</span>`;
      }).join('');
    }

    // 120 FPS GPU Accelerated Spin - Aligns winning segment dead center with needle
    function triggerSpin(winningIndex) {
      if (isSpinningAnimation) return;
      isSpinningAnimation = true;

      const totalSegments = 32;
      const degPerSegment = 360 / totalSegments;
      // Segment 0 (30x Green) is centered at 12 o'clock (-90 deg).
      // Segment i is located at (i * degPerSegment) clockwise from 12 o'clock.
      // Rotating clockwise by R brings segment i directly under the 12 o'clock needle:
      const spinOffset = (360 - ((winningIndex * degPerSegment) % 360)) % 360;
      const currentMod = ((currentRotationDeg % 360) + 360) % 360;
      let forwardDegrees = spinOffset - currentMod;
      if (forwardDegrees <= 0) {
        forwardDegrees += 360;
      }
      const extraSpins = 5 * 360; // 5 full dramatic rotations
      const targetDeg = currentRotationDeg + extraSpins + forwardDegrees;
      currentRotationDeg = targetDeg;

      canvas.style.transition = 'transform 4.5s cubic-bezier(0.12, 0.85, 0.22, 1)';
      canvas.style.willChange = 'transform';
      canvas.style.transform = `rotate(${targetDeg}deg) translate3d(0, 0, 0)`;

      setTimeout(() => {
        isSpinningAnimation = false;
      }, 4600);
    }

    function hideWin() {
      document.getElementById('winToast').style.display = 'none';
    }

    // Polling Loop
    async function syncLoop() {
      try {
        const headers = {};
        if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
        const res = await fetch(serverBaseUrl + '/api/v1/ring-of-future/state', { headers });
        const json = await res.json();
        if (json.success) updateUI(json.data);
      } catch (_) {}
    }

    setInterval(syncLoop, 1000);
    syncLoop();
  </script>
</body>
