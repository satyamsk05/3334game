<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ring of Future - VIP Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07040D;
      --card-bg: rgba(22, 14, 38, 0.75);
      --c-2x: #94A3B8;
      --c-3x: #A855F7;
      --c-5x: #F97316;
      --c-30x: #10B981;
      --gold: #F59E0B;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #180D2B 0%, #08040F 70%, #040208 100%);
      color: #FFFFFF;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-viewport {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 920px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 16px 16px;
      position: relative;
    }

    /* TOP HEADER */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 44px;
      z-index: 20;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #E2E8F0;
      border-radius: 12px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.15s;
    }
    .btn-back:active { transform: scale(0.92); }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      color: #34D399;
      letter-spacing: 0.3px;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10B981;
      animation: pulse-live 1.5s infinite;
    }
    @keyframes pulse-live {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .wallet-capsule {
      background: linear-gradient(135deg, #059669 0%, #10B981 100%);
      padding: 4px 6px 4px 12px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35), inset 0 1px 0 rgba(255,255,255,0.3);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .wallet-capsule:active { transform: scale(0.95); }
    .wallet-amount {
      font-size: 14px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.2px;
    }
    .wallet-add {
      background: #FFFFFF;
      color: #065F46;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    /* WHEEL STAGE */
    .wheel-stage {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 4px 0;
    }

    .wheel-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Chrome Outer Ring Bezel */
    .wheel-chrome-bezel {
      position: absolute;
      width: 318px;
      height: 318px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 2;
    }

    canvas#wheelCanvas {
      display: block;
      width: 310px;
      height: 310px;
      border-radius: 50%;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      z-index: 1;
    }

    /* Sharp Futuristic Indicator Pointer */
    .wheel-pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 28px;
      z-index: 10;
      pointer-events: none;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.8));
    }
    .wheel-pointer svg {
      width: 100%;
      height: 100%;
    }

    /* Central Holographic Hub */
    .hub-center {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, #1F1535 0%, #0E081A 85%);
      border: 3px solid rgba(168, 85, 247, 0.4);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(168, 85, 247, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }
    .hub-timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 26px;
      font-weight: 900;
      color: #34D399;
      text-shadow: 0 0 12px rgba(52, 211, 153, 0.6);
      line-height: 1;
    }
    .hub-phase {
      font-size: 10px;
      font-weight: 800;
      color: #D1D5DB;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 4px;
      text-align: center;
      padding: 0 8px;
    }

    /* History Pill Bar */
    .history-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      margin: 4px 0 8px;
    }
    .history-label {
      font-size: 10px;
      font-weight: 800;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .history-items {
      display: flex;
      gap: 5px;
    }
    .h-badge {
      font-size: 11px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 6px;
      color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .h-2x { background: #64748B; }
    .h-3x { background: #9333EA; }
    .h-5x { background: #EA580C; }
    .h-30x { background: #059669; border: 1px solid #34D399; }

    /* 3D TACTILE BETTING GRID */
    .bet-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 8px;
    }
    .bet-card {
      height: 82px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.12s, box-shadow 0.12s;
      border: 1px solid transparent;
      overflow: hidden;
    }
    .bet-card:active {
      transform: scale(0.95);
    }

    /* Distinct Multiplier Gradients */
    .card-2x {
      background: linear-gradient(145deg, #1E293B 0%, #0F172A 100%);
      border-color: rgba(148, 163, 184, 0.35);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.6), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .card-2x .mult-val { color: #E2E8F0; text-shadow: 0 0 14px rgba(226, 232, 240, 0.4); }

    .card-3x {
      background: linear-gradient(145deg, #3B0764 0%, #1E0436 100%);
      border-color: rgba(168, 85, 247, 0.5);
      box-shadow: 0 6px 18px rgba(59, 7, 100, 0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .card-3x .mult-val { color: #C084FC; text-shadow: 0 0 16px rgba(192, 132, 252, 0.7); }

    .card-5x {
      background: linear-gradient(145deg, #431407 0%, #240A03 100%);
      border-color: rgba(249, 115, 22, 0.5);
      box-shadow: 0 6px 18px rgba(67, 20, 7, 0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .card-5x .mult-val { color: #FB923C; text-shadow: 0 0 16px rgba(251, 146, 60, 0.7); }

    .card-30x {
      background: linear-gradient(145deg, #064E3B 0%, #022C22 100%);
      border-color: rgba(16, 185, 129, 0.6);
      box-shadow: 0 6px 18px rgba(6, 78, 59, 0.6), inset 0 1px 0 rgba(52, 211, 153, 0.3);
    }
    .card-30x .mult-val { color: #34D399; text-shadow: 0 0 18px rgba(52, 211, 153, 0.8); }

    .card-crown {
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 11px;
      color: #FCD34D;
      text-shadow: 0 0 8px #F59E0B;
    }

    .mult-val {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .mult-sub {
      font-size: 10px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .bet-placed-pill {
      position: absolute;
      bottom: 5px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 1px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 900;
      color: #FCD34D;
      display: none;
    }

    /* CASINO POKER CHIP SELECTOR */
    .chip-dock {
      background: rgba(15, 9, 26, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(12px);
    }

    .chip-item {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
      border: 2px dashed rgba(255, 255, 255, 0.4);
      font-weight: 900;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
    .chip-item:active { transform: scale(0.9); }
    .chip-item.active {
      transform: translateY(-8px) scale(1.12);
      border: 2px solid #FCD34D;
      box-shadow: 0 8px 20px rgba(252, 211, 77, 0.45);
    }

    .chip-10 { background: radial-gradient(circle, #0284C7 0%, #0369A1 100%); color: white; }
    .chip-500 { background: radial-gradient(circle, #7C3AED 0%, #6D28D9 100%); color: white; }
    .chip-2k { background: radial-gradient(circle, #D97706 0%, #B45309 100%); color: white; }
    .chip-5k { background: radial-gradient(circle, #059669 0%, #047857 100%); color: white; }
    .chip-20k { background: radial-gradient(circle, #DC2626 0%, #B91C1C 100%); color: white; }

    .chip-currency { font-size: 8px; font-weight: 800; opacity: 0.85; line-height: 1; }
    .chip-num { font-size: 13px; font-weight: 900; line-height: 1; margin-top: 1px; }

    /* WINNING MODAL CELEBRATION */
    .win-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .win-box {
      background: radial-gradient(circle, #251240 0%, #0C0517 100%);
      border: 2px solid #FCD34D;
      box-shadow: 0 0 50px rgba(252, 211, 77, 0.5);
      border-radius: 28px;
      padding: 30px;
      text-align: center;
      transform: scale(0.7);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn {
      to { transform: scale(1); }
    }
    .win-title {
      font-size: 16px;
      font-weight: 900;
      color: #FCD34D;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .win-payout {
      font-size: 44px;
      font-weight: 900;
      color: #FFFFFF;
      text-shadow: 0 0 25px rgba(52, 211, 153, 0.8);
      margin: 8px 0;
    }
    .win-sub {
      font-size: 12px;
      color: #94A3B8;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="game-viewport">

    <!-- TOP HEADER -->
    <div class="header-bar">
      <button class="btn-back" onclick="handleBack()">◄ Lobby</button>
      <div class="live-badge">
        <div class="live-dot"></div>
        <span>1,842 PLAYING</span>
      </div>
      <div class="wallet-capsule" onclick="handleDeposit()">
        <span class="wallet-amount" id="walletAmountDisplay">₹0.00</span>
        <div class="wallet-add">+</div>
      </div>
    </div>

    <!-- WHEEL STAGE AREA -->
    <div class="wheel-stage">
      <div class="wheel-wrapper">
        <div class="wheel-chrome-bezel"></div>
        <canvas id="wheelCanvas" width="310" height="310"></canvas>
        
        <!-- Top Indicator Pointer Arrow -->
        <div class="wheel-pointer">
          <svg viewBox="0 0 22 28" fill="none">
            <path d="M11 28L0 6C0 2.68629 2.68629 0 6 0H16C19.3137 0 22 2.68629 22 6L11 28Z" fill="#FCD34D"/>
            <path d="M11 24L3 7H19L11 24Z" fill="#FFFFFF"/>
          </svg>
        </div>

        <!-- Center Holographic Hub -->
        <div class="hub-center">
          <div class="hub-timer" id="hubTimer">15s</div>
          <div class="hub-phase" id="hubPhase">PLACE BETS</div>
        </div>
      </div>
    </div>

    <!-- HISTORY STRIP -->
    <div class="history-strip">
      <span class="history-label">History</span>
      <div class="history-items" id="historyItemsContainer"></div>
    </div>

    <!-- 2x2 TACTICAL BETTING GRID -->
    <div>
      <div class="bet-grid">
        <div class="bet-card card-2x" onclick="handleBet('2x')">
          <div class="mult-val">2x</div>
          <div class="mult-sub">PAYS 2X</div>
          <div class="bet-placed-pill" id="badge2x">₹0</div>
        </div>
        <div class="bet-card card-3x" onclick="handleBet('3x')">
          <div class="mult-val">3x</div>
          <div class="mult-sub">PAYS 3X</div>
          <div class="bet-placed-pill" id="badge3x">₹0</div>
        </div>
        <div class="bet-card card-5x" onclick="handleBet('5x')">
          <div class="mult-val">5x</div>
          <div class="mult-sub">PAYS 5X</div>
          <div class="bet-placed-pill" id="badge5x">₹0</div>
        </div>
        <div class="bet-card card-30x" onclick="handleBet('30x')">
          <span class="card-crown">👑</span>
          <div class="mult-val">30x</div>
          <div class="mult-sub">JACKPOT 30X</div>
          <div class="bet-placed-pill" id="badge30x">₹0</div>
        </div>
      </div>

      <!-- CASINO CHIP DOCK -->
      <div class="chip-dock">
        <div class="chip-item chip-10 active" onclick="selectChip(10, this)">
          <span class="chip-currency">₹</span>
          <span class="chip-num">10</span>
        </div>
        <div class="chip-item chip-500" onclick="selectChip(500, this)">
          <span class="chip-currency">₹</span>
          <span class="chip-num">500</span>
        </div>
        <div class="chip-item chip-2k" onclick="selectChip(2000, this)">
          <span class="chip-currency">₹</span>
          <span class="chip-num">2K</span>
        </div>
        <div class="chip-item chip-5k" onclick="selectChip(5000, this)">
          <span class="chip-currency">₹</span>
          <span class="chip-num">5K</span>
        </div>
        <div class="chip-item chip-20k" onclick="selectChip(20000, this)">
          <span class="chip-currency">₹</span>
          <span class="chip-num">20K</span>
        </div>
      </div>
    </div>

  </div>

  <!-- WIN POPUP CELEBRATION -->
  <div class="win-overlay" id="winOverlay" onclick="dismissWin()">
    <div class="win-box">
      <div class="win-title">✨ BIG WINNER! ✨</div>
      <div class="win-payout" id="winPayoutText">₹3,000</div>
      <div class="win-sub">Credited to your balance</div>
    </div>
  </div>

  <script>
    // Audio Synthesizer (Zero External Assets - 100% Instant Offline)
    let audioCtx = null;
    function playBeep(freq, type, duration) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (_) {}
    }

    function soundChip() { playBeep(650, 'triangle', 0.08); }
    function soundTick() { playBeep(880, 'sine', 0.04); }
    function soundWin() {
      playBeep(523, 'triangle', 0.2);
      setTimeout(() => playBeep(659, 'triangle', 0.2), 120);
      setTimeout(() => playBeep(784, 'triangle', 0.4), 240);
    }

    // Android Bridge Dynamic Resolution
    const serverBaseUrl = (window.AndroidBridge && window.AndroidBridge.getServerUrl)
      ? window.AndroidBridge.getServerUrl()
      : 'http://3.7.73.109:4001';

    let userId = (window.AndroidBridge && window.AndroidBridge.getUserId)
      ? window.AndroidBridge.getUserId()
      : '';
    let authToken = (window.AndroidBridge && window.AndroidBridge.getAuthToken)
      ? window.AndroidBridge.getAuthToken()
      : '';

    let selectedChipRupees = 10;
    let currentPhase = 'BETTING';
    let currentRotationDeg = 0;
    let isSpinningAnimation = false;

    // 32 Segment Colors
    const SEGMENT_COLORS = [
      '#10B981', '#64748B', '#9333EA', '#64748B', '#EA580C', '#64748B', '#9333EA', '#64748B',
      '#EA580C', '#64748B', '#9333EA', '#64748B', '#9333EA', '#64748B', '#EA580C', '#64748B',
      '#9333EA', '#64748B', '#9333EA', '#64748B', '#EA580C', '#64748B', '#9333EA', '#64748B',
      '#EA580C', '#64748B', '#9333EA', '#64748B', '#9333EA', '#64748B', '#EA580C', '#9333EA'
    ];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const outerRadius = 150;
    const innerRadius = 78;

    // Render 32 Segment Wheel with Chrome Dividers and LED Pegs ONCE
    function initWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const totalSegments = 32;
      const anglePerSegment = (2 * Math.PI) / totalSegments;

      ctx.save();
      ctx.translate(centerX, centerY);

      for (let i = 0; i < totalSegments; i++) {
        const startAngle = i * anglePerSegment;
        const endAngle = startAngle + anglePerSegment;

        ctx.beginPath();
        ctx.arc(0, 0, outerRadius, startAngle, endAngle);
        ctx.arc(0, 0, innerRadius, endAngle, startAngle, true);
        ctx.closePath();

        ctx.fillStyle = SEGMENT_COLORS[i];
        ctx.fill();

        // Chrome divider line
        ctx.lineWidth = 1.8;
        ctx.strokeStyle = '#1E1233';
        ctx.stroke();

        // Neon Golden LED Peg at segment edge
        const pegAngle = startAngle;
        const pegX = Math.cos(pegAngle) * (outerRadius - 6);
        const pegY = Math.sin(pegAngle) * (outerRadius - 6);

        ctx.beginPath();
        ctx.arc(pegX, pegY, 2.2, 0, 2 * Math.PI);
        ctx.fillStyle = '#FDE047';
        ctx.fill();
      }

      ctx.restore();
    }

    initWheel();

    function selectChip(amount, elem) {
      selectedChipRupees = amount;
      document.querySelectorAll('.chip-item').forEach(c => c.classList.remove('active'));
      elem.classList.add('active');
      soundChip();
    }

    function handleBack() {
      if (window.AndroidBridge && window.AndroidBridge.closeGame) {
        window.AndroidBridge.closeGame();
      } else {
        window.history.back();
      }
    }

    function handleDeposit() {
      if (window.AndroidBridge && window.AndroidBridge.openDeposit) {
        window.AndroidBridge.openDeposit();
      } else {
        window.location.href = serverBaseUrl + '/pay?amount=500';
      }
    }

    async function handleBet(multiplierType) {
      if (currentPhase !== 'BETTING') {
        alert('Bets locked for this round!');
        return;
      }
      soundChip();

      try {
        const headers = { 'Content-Type': 'application/json' };
        if (authToken) headers['Authorization'] = 'Bearer ' + authToken;

        const res = await fetch(serverBaseUrl + '/api/v1/ring-of-future/bet', {
          method: 'POST',
          headers,
          body: JSON.stringify({ userId, multiplierType, amountRupees: selectedChipRupees, token: authToken })
        });
        const data = await res.json();
        if (data.success) {
          updateUI(data.data);
        } else {
          alert(data.message || 'Bet placement failed');
        }
      } catch (e) {
        alert('Network error placing bet');
      }
    }

    function updateUI(data) {
      if (!data) return;
      const state = data.gameState;
      const wallet = data.wallet;

      currentPhase = state.phase;
      document.getElementById('walletAmountDisplay').innerText = '₹' + (wallet.totalPaise / 100).toFixed(2);
      document.getElementById('hubTimer').innerText = state.secondsRemaining + 's';

      if (state.phase === 'BETTING') {
        document.getElementById('hubPhase').innerText = 'PLACE BETS';
        document.getElementById('hubTimer').style.color = '#34D399';
      } else if (state.phase === 'LOCKED') {
        document.getElementById('hubPhase').innerText = 'LOCKED';
        document.getElementById('hubTimer').style.color = '#F59E0B';
      } else if (state.phase === 'SPINNING') {
        document.getElementById('hubPhase').innerText = 'SPINNING';
        document.getElementById('hubTimer').style.color = '#C084FC';
        trigger120FpsSpin(state.winningSegmentIndex);
      } else if (state.phase === 'RESULT_SHOW') {
        document.getElementById('hubPhase').innerText = 'WIN: ' + state.winningType;
        document.getElementById('hubTimer').style.color = '#FCD34D';
      }

      // Update Badges
      updateBadge('badge2x', state.userBets.grey2x);
      updateBadge('badge3x', state.userBets.purple3x);
      updateBadge('badge5x', state.userBets.orange5x);
      updateBadge('badge30x', state.userBets.green30x);

      // Render History
      renderHistory(state.recentResults || []);
    }

    function updateBadge(id, paise) {
      const el = document.getElementById(id);
      if (paise > 0) {
        el.innerText = '₹' + (paise / 100).toFixed(0);
        el.style.display = 'block';
      } else {
        el.style.display = 'none';
      }
    }

    function renderHistory(results) {
      const c = document.getElementById('historyItemsContainer');
      c.innerHTML = results.slice(0, 7).map(type => {
        let cls = 'h-2x';
        if (type === '3x') cls = 'h-3x';
        if (type === '5x') cls = 'h-5x';
        if (type === '30x') cls = 'h-30x';
        return `<div class="h-badge ${cls}">${type}</div>`;
      }).join('');
    }

    // 120 FPS GPU COMPOSITED SPIN
    function trigger120FpsSpin(winningIndex) {
      if (isSpinningAnimation) return;
      isSpinningAnimation = true;

      const totalSegments = 32;
      const degPerSegment = 360 / totalSegments;
      const segmentCenterDeg = (winningIndex + 0.5) * degPerSegment;
      const extraSpins = 6 * 360; // 6 full exciting spins

      // 12 o'clock pointer is 270 deg
      const targetDeg = currentRotationDeg + extraSpins + (360 - (currentRotationDeg % 360)) + (270 - segmentCenterDeg);
      currentRotationDeg = targetDeg;

      canvas.style.transition = 'transform 4.8s cubic-bezier(0.12, 0.88, 0.22, 1)';
      canvas.style.willChange = 'transform';
      canvas.style.transform = `rotate(${targetDeg}deg) translate3d(0, 0, 0)`;

      // Wheel ticking sound simulation
      let tickInterval = setInterval(soundTick, 180);
      setTimeout(() => {
        clearInterval(tickInterval);
        isSpinningAnimation = false;
        soundWin();
      }, 4850);
    }

    function dismissWin() {
      document.getElementById('winOverlay').style.display = 'none';
    }

    // Live State Loop
    async function syncLoop() {
      try {
        const headers = {};
        if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
        const res = await fetch(serverBaseUrl + '/api/v1/ring-of-future/state', { headers });
        const json = await res.json();
        if (json.success) updateUI(json.data);
      } catch (_) {}
    }

    setInterval(syncLoop, 1000);
    syncLoop();
  </script>
</body>
</html>
