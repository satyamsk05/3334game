<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ring of Future</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #0A0C11;
      --card-bg: #1B2230;
      --card-border: #2F394C;
      --card-surface: #202A3B;
      --c-2x: #94A3B8;
      --c-3x: #8B5CF6;
      --c-5x: #F97316;
      --c-30x: #10B981;
      --gold: #FFB800;
      --purple-primary: #6C47FF;
      --text-primary: #FFFFFF;
      --text-muted: #94A3B8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Rubik', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-app);
      color: var(--text-primary);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-screen {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 920px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 18px 20px;
      position: relative;
    }

    /* 1. TOP APP BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 44px;
      z-index: 10;
    }

    .btn-icon-back {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.15s, transform 0.15s;
    }
    .btn-icon-back:active { transform: scale(0.92); }

    .game-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text-primary);
    }

    /* Minimalist Wallet Capsule Matching App */
    .wallet-capsule {
      height: 36px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2px 4px 2px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .wallet-capsule:active { transform: scale(0.95); }
    .wallet-val {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .wallet-plus {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--purple-primary);
      color: white;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 2. MINIMALIST CLEAN WHEEL */
    .wheel-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 4px 0;
    }

    .wheel-container {
      position: relative;
      width: 290px;
      height: 290px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#wheelCanvas {
      display: block;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      z-index: 1;
    }

    /* Minimalist Top Indicator Pin */
    .pointer-needle {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 18px;
      z-index: 8;
      pointer-events: none;
    }
    .pointer-needle svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* Minimalist Center Hub */
    .center-hub {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #141923;
      border: 2px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
    }
    .hub-seconds {
      font-size: 26px;
      font-weight: 800;
      color: #34D399;
      line-height: 1;
    }
    .hub-status {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* History Clean Bar */
    .history-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      margin-top: 10px;
    }
    .h-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      color: white;
    }
    .hp-2x { background: #475569; }
    .hp-3x { background: #7C3AED; }
    .hp-5x { background: #EA580C; }
    .hp-30x { background: #059669; }

    /* 3. APP-STYLE CLEAN BETTING CARDS */
    .bet-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-tile {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      height: 82px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      transition: border-color 0.15s, transform 0.12s, background 0.15s;
    }
    .card-tile:active {
      transform: scale(0.96);
    }

    .tile-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .tile-mult {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
    }
    .tile-2x .tile-mult { color: #CBD5E1; }
    .tile-3x .tile-mult { color: #A78BFA; }
    .tile-5x .tile-mult { color: #FB923C; }
    .tile-30x .tile-mult { color: #34D399; }

    .tile-desc {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .tile-bet-pill {
      align-self: flex-start;
      background: #141923;
      border: 1px solid var(--card-border);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      display: none;
    }

    /* Active Highlight on Placed Bet */
    .tile-2x.has-bet { border-color: #64748B; background: rgba(30, 41, 59, 0.8); }
    .tile-3x.has-bet { border-color: #8B5CF6; background: rgba(59, 7, 100, 0.4); }
    .tile-5x.has-bet { border-color: #F97316; background: rgba(67, 20, 7, 0.4); }
    .tile-30x.has-bet { border-color: #10B981; background: rgba(6, 78, 59, 0.4); }

    /* 4. CLEAN CHIP SELECTOR */
    .chip-selector {
      background: #141923;
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 6px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .chip-button {
      flex: 1;
      height: 38px;
      border-radius: 12px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip-button:active { transform: scale(0.94); }
    .chip-button.active {
      background: var(--purple-primary);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 2px 10px rgba(108, 71, 255, 0.35);
    }

    /* 5. CLEAN WIN NOTIFICATION BANNER */
    .win-toast {
      position: absolute;
      top: 60px;
      left: 18px;
      right: 18px;
      background: #10B981;
      color: #FFFFFF;
      padding: 12px 16px;
      border-radius: 14px;
      display: none;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
      z-index: 50;
      animation: slideDown 0.3s ease forwards;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .win-toast-title { font-size: 13px; font-weight: 800; }
    .win-toast-amount { font-size: 16px; font-weight: 900; }
  </style>
</head>
<body>

  <div class="game-screen">

    <!-- 1. TOP APP BAR -->
    <div class="top-bar">
      <button class="btn-icon-back" onclick="handleBack()">←</button>
      <div class="game-title">Ring of Future</div>
      <div class="wallet-capsule" onclick="handleDeposit()">
        <span class="wallet-val" id="walletDisplay">₹0.00</span>
        <div class="wallet-plus">+</div>
      </div>
    </div>

    <!-- WIN TOAST -->
    <div class="win-toast" id="winToast" onclick="hideWin()">
      <div>
        <div class="win-toast-title">ROUND WON!</div>
        <div style="font-size: 11px; opacity: 0.85;">Added to your wallet</div>
      </div>
      <div class="win-toast-amount" id="winToastAmount">₹0</div>
    </div>

    <!-- 2. MINIMALIST CLEAN WHEEL -->
    <div class="wheel-stage">
      <div class="wheel-container">
        <canvas id="wheelCanvas" width="280" height="280"></canvas>
        
        <!-- Clean Pointer Needle -->
        <div class="pointer-needle">
          <svg viewBox="0 0 14 18" fill="none">
            <path d="M7 18L0 4C0 1.79086 1.79086 0 4 0H10C12.2091 0 14 1.79086 14 4L7 18Z" fill="#FFFFFF"/>
          </svg>
        </div>

        <!-- Minimalist Center Hub -->
        <div class="center-hub">
          <div class="hub-seconds" id="hubSeconds">15s</div>
          <div class="hub-status" id="hubStatus">PLACE BETS</div>
        </div>
      </div>

      <!-- History Clean Bar -->
      <div class="history-bar">
        <span style="font-size: 11px; color: var(--text-muted); font-weight: 600; margin-right: 4px;">Recent:</span>
        <div id="historyRow" style="display: flex; gap: 5px;"></div>
      </div>
    </div>

    <!-- 3. APP-STYLE CLEAN BETTING GRID -->
    <div>
      <div class="bet-grid">
        <div class="card-tile tile-2x" id="tile2x" onclick="handleBet('2x')">
          <div class="tile-top">
            <span class="tile-mult">2x</span>
            <span class="tile-desc">Low Risk</span>
          </div>
          <div class="tile-bet-pill" id="badge2x">₹0</div>
        </div>

        <div class="card-tile tile-3x" id="tile3x" onclick="handleBet('3x')">
          <div class="tile-top">
            <span class="tile-mult">3x</span>
            <span class="tile-desc">Medium</span>
          </div>
          <div class="tile-bet-pill" id="badge3x">₹0</div>
        </div>

        <div class="card-tile tile-5x" id="tile5x" onclick="handleBet('5x')">
          <div class="tile-top">
            <span class="tile-mult">5x</span>
            <span class="tile-desc">High Win</span>
          </div>
          <div class="tile-bet-pill" id="badge5x">₹0</div>
        </div>

        <div class="card-tile tile-30x" id="tile30x" onclick="handleBet('30x')">
          <div class="tile-top">
            <span class="tile-mult">30x</span>
            <span class="tile-desc" style="color: #34D399;">Mega Win</span>
          </div>
          <div class="tile-bet-pill" id="badge30x">₹0</div>
        </div>
      </div>

      <!-- 4. CLEAN CHIP SELECTOR -->
      <div class="chip-selector">
        <button class="chip-button active" onclick="selectChip(10, this)">₹10</button>
        <button class="chip-button" onclick="selectChip(500, this)">₹500</button>
        <button class="chip-button" onclick="selectChip(2000, this)">₹2K</button>
        <button class="chip-button" onclick="selectChip(5000, this)">₹5K</button>
        <button class="chip-button" onclick="selectChip(20000, this)">₹20K</button>
      </div>
    </div>

  </div>

  <script>
    // Android Bridge Integration
    const serverBaseUrl = (window.AndroidBridge && window.AndroidBridge.getServerUrl)
      ? window.AndroidBridge.getServerUrl()
      : 'http://3.7.73.109:4001';

    let userId = (window.AndroidBridge && window.AndroidBridge.getUserId)
      ? window.AndroidBridge.getUserId()
      : '';
    let authToken = (window.AndroidBridge && window.AndroidBridge.getAuthToken)
      ? window.AndroidBridge.getAuthToken()
      : '';

    let selectedChipRupees = 10;
    let currentPhase = 'BETTING';
    let currentRotationDeg = 0;
    let isSpinningAnimation = false;

    // 32 Segment Palette (Clean contrast matte colors)
    const SEGMENT_COLORS = [
      '#10B981', '#64748B', '#8B5CF6', '#64748B', '#F97316', '#64748B', '#8B5CF6', '#64748B',
      '#F97316', '#64748B', '#8B5CF6', '#64748B', '#8B5CF6', '#64748B', '#F97316', '#64748B',
      '#8B5CF6', '#64748B', '#8B5CF6', '#64748B', '#F97316', '#64748B', '#8B5CF6', '#64748B',
      '#F97316', '#64748B', '#8B5CF6', '#64748B', '#8B5CF6', '#64748B', '#F97316', '#8B5CF6'
    ];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const outerRadius = 136;
    const innerRadius = 72;

    // Clean Canvas Wheel Pre-Render
    function drawCleanWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const totalSegments = 32;
      const anglePerSegment = (2 * Math.PI) / totalSegments;

      ctx.save();
      ctx.translate(centerX, centerY);

      for (let i = 0; i < totalSegments; i++) {
        const startAngle = i * anglePerSegment;
        const endAngle = startAngle + anglePerSegment;

        ctx.beginPath();
        ctx.arc(0, 0, outerRadius, startAngle, endAngle);
        ctx.arc(0, 0, innerRadius, endAngle, startAngle, true);
        ctx.closePath();

        ctx.fillStyle = SEGMENT_COLORS[i];
        ctx.fill();

        ctx.lineWidth = 1.2;
        ctx.strokeStyle = '#0A0C11';
        ctx.stroke();
      }

      ctx.restore();
    }

    drawCleanWheel();

    function selectChip(amount, btn) {
      selectedChipRupees = amount;
      document.querySelectorAll('.chip-button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function handleBack() {
      if (window.AndroidBridge && window.AndroidBridge.closeGame) {
        window.AndroidBridge.closeGame();
      } else {
        window.history.back();
      }
    }

    function handleDeposit() {
      if (window.AndroidBridge && window.AndroidBridge.openDeposit) {
        window.AndroidBridge.openDeposit();
      } else {
        window.location.href = serverBaseUrl + '/pay?amount=500';
      }
    }

    async function handleBet(multiplierType) {
      if (currentPhase !== 'BETTING') {
        alert('Bets are closed for this round');
        return;
      }

      try {
        const headers = { 'Content-Type': 'application/json' };
        if (authToken) headers['Authorization'] = 'Bearer ' + authToken;

        const res = await fetch(serverBaseUrl + '/api/v1/ring-of-future/bet', {
          method: 'POST',
          headers,
          body: JSON.stringify({ userId, multiplierType, amountRupees: selectedChipRupees, token: authToken })
        });
        const data = await res.json();
        if (data.success) {
          updateUI(data.data);
        } else {
          alert(data.message || 'Unable to place bet');
        }
      } catch (_) {
        alert('Network connection issue');
      }
    }

    function updateUI(data) {
      if (!data) return;
      const state = data.gameState;
      const wallet = data.wallet;

      currentPhase = state.phase;
      document.getElementById('walletDisplay').innerText = '₹' + (wallet.totalPaise / 100).toFixed(2);
      document.getElementById('hubSeconds').innerText = state.secondsRemaining + 's';

      if (state.phase === 'BETTING') {
        document.getElementById('hubStatus').innerText = 'PLACE BETS';
        document.getElementById('hubSeconds').style.color = '#34D399';
      } else if (state.phase === 'LOCKED') {
        document.getElementById('hubStatus').innerText = 'LOCKED';
        document.getElementById('hubSeconds').style.color = '#F59E0B';
      } else if (state.phase === 'SPINNING') {
        document.getElementById('hubStatus').innerText = 'SPINNING';
        document.getElementById('hubSeconds').style.color = '#A78BFA';
        triggerSpin(state.winningSegmentIndex);
      } else if (state.phase === 'RESULT_SHOW') {
        document.getElementById('hubStatus').innerText = 'WIN: ' + state.winningType;
        document.getElementById('hubSeconds').style.color = '#34D399';
      }

      // Update Badges & Active Card Highlights
      updateTileBadge('badge2x', 'tile2x', state.userBets.grey2x);
      updateTileBadge('badge3x', 'tile3x', state.userBets.purple3x);
      updateTileBadge('badge5x', 'tile5x', state.userBets.orange5x);
      updateTileBadge('badge30x', 'tile30x', state.userBets.green30x);

      // Render History
      renderHistory(state.recentResults || []);
    }

    function updateTileBadge(badgeId, tileId, paise) {
      const badge = document.getElementById(badgeId);
      const tile = document.getElementById(tileId);
      if (paise > 0) {
        badge.innerText = '₹' + (paise / 100).toFixed(0);
        badge.style.display = 'block';
        tile.classList.add('has-bet');
      } else {
        badge.style.display = 'none';
        tile.classList.remove('has-bet');
      }
    }

    function renderHistory(results) {
      const row = document.getElementById('historyRow');
      row.innerHTML = results.slice(0, 6).map(type => {
        let cls = 'hp-2x';
        if (type === '3x') cls = 'hp-3x';
        if (type === '5x') cls = 'hp-5x';
        if (type === '30x') cls = 'hp-30x';
        return `<span class="h-pill ${cls}">${type}</span>`;
      }).join('');
    }

    // 120 FPS GPU Accelerated Spin
    function triggerSpin(winningIndex) {
      if (isSpinningAnimation) return;
      isSpinningAnimation = true;

      const totalSegments = 32;
      const degPerSegment = 360 / totalSegments;
      const segmentCenterDeg = (winningIndex + 0.5) * degPerSegment;
      const extraSpins = 5 * 360;

      // 12 o'clock needle pointer is at 270 deg
      const targetDeg = currentRotationDeg + extraSpins + (360 - (currentRotationDeg % 360)) + (270 - segmentCenterDeg);
      currentRotationDeg = targetDeg;

      canvas.style.transition = 'transform 4.5s cubic-bezier(0.12, 0.85, 0.22, 1)';
      canvas.style.willChange = 'transform';
      canvas.style.transform = `rotate(${targetDeg}deg) translate3d(0, 0, 0)`;

      setTimeout(() => {
        isSpinningAnimation = false;
      }, 4600);
    }

    function hideWin() {
      document.getElementById('winToast').style.display = 'none';
    }

    // Polling Loop for live sync
    async function syncLoop() {
      try {
        const headers = {};
        if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
        const res = await fetch(serverBaseUrl + '/api/v1/ring-of-future/state', { headers });
        const json = await res.json();
        if (json.success) updateUI(json.data);
      } catch (_) {}
    }

    setInterval(syncLoop, 1000);
    syncLoop();
  </script>
</body>
</html>
